[project]
name = "deskpilot"
version = "0.1.0"
description = "Low-token Windows computer-use MCP server with a visible agent cursor, screen picker and ask-first permissions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "computer-use", "windows", "automation", "ai-agent", "claude", "ui-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0,<3",
    "mss>=9.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "websocket-client>=1.8",
    "psutil>=5.9",
    # Windows-only: DeskPilot controls a Windows desktop. Elsewhere the server still starts and lists its tools.
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "customtkinter>=5.2; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/iamtahiralvi/DeskPilot"
Repository = "https://github.com/iamtahiralvi/DeskPilot"
Issues = "https://github.com/iamtahiralvi/DeskPilot/issues"

[project.scripts]
deskpilot = "deskpilot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
